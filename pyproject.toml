[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ligeia-mcp-server"
version = "1.0.0"
description = "Autonomous, edge-native micro-commerce computational engines monetized via x402 on Base Mainnet."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gregory Reeves", email = "adventure1670@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "x402", "base-mainnet", "ai-agents", "media-geometry", "comfyui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "web3>=6.0.0",
    "eth-account>=0.11.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
[project.scripts]
ligeia-mcp-server = "ligeia_mcp_server:main"
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
